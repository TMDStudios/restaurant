<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script type="text/javascript">
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;

        // Avoid redirecting if the path has already been redirected.
        if (redirect && redirect !== location.pathname) {
            history.replaceState(null, "", redirect);
        }

        // Redirect to the correct location, ensuring it's under /restaurant.
        window.location.replace("/restaurant" + location.pathname + location.search + location.hash);
    </script>
</head>
<body>
    Redirecting...
</body>
</html>
